name: Claude Code Review

on:
  # Interactive mode: Respond to @claude mentions
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

  # Automated review on PR events
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.{ts,tsx,js,jsx}"

  # Manual trigger for on-demand reviews
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

permissions: {}  # No default permissions (principle of least privilege)

jobs:
  # Interactive mode: responds to @claude mentions in comments
  claude-interactive:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Only need latest commit for interactive mode

      - name: Claude interactive mode
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          additional_permissions: |
            actions: read
          claude_args: "--model claude-sonnet-4-5-20250929 --max-turns 10"

  # Automated code review on PR events
  claude-automated-review:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    # Optional: Filter by PR author to reduce costs
    # if: |
    #   (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
    #   (github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' ||
    #    github.event.pull_request.user.login == 'external-contributor')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine PR number
        id: pr-info
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "pr_number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
          else
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Run automated code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review PR #${{ steps.pr-info.outputs.pr_number }} with these priorities:

            1. Security: Check for vulnerabilities (XSS, SQL injection, auth issues)
            2. Bugs: Logic errors and potential runtime issues
            3. Code Quality: Adherence to project conventions in CLAUDE.md
            4. Performance: Identify bottlenecks and inefficiencies
            5. Testing: Verify test coverage for changes

            For each inline comment you make, end it with a personalized AI prompts section. The prompts MUST be:
            - Specific to the actual code/file/function being commented
            - Contextual to the issue you identified
            - Actionable and copy-paste ready
            - 2-3 prompts maximum per comment

            Format:
            ---
            <details>
            <summary>💡 Suggestions</summary>

            ```
            [Personalized prompt 1 based on this specific code]
            [Personalized prompt 2 based on this specific code]
            [Personalized prompt 3 based on this specific code]
            ```
            </details>

            Examples:
            - If commenting on `userAuth.validateToken()`: "Explain the token validation logic in userAuth.validateToken()", "Add unit tests for token expiration in validateToken()"
            - If commenting on performance in a loop: "Optimize the iteration in [specific function name]", "Explain why this loop might cause performance issues"
            - If commenting on missing error handling: "Add try-catch for [specific operation]", "Suggest error handling strategy for [specific function]"

            Post a summary comment with overall findings (no prompts section in summary).
          claude_args: |
            --model claude-sonnet-4-5-20250929
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh pr diff:*)"

  # Security-focused review for sensitive changes
  claude-security-audit:
    if: |
      github.event_name == 'pull_request' &&
      (
        contains(github.event.pull_request.title, 'auth') ||
        contains(github.event.pull_request.title, 'security') ||
        contains(github.event.pull_request.title, 'payment') ||
        contains(github.event.pull_request.title, 'stripe')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Security audit with Opus
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Perform comprehensive security audit on PR #${{ github.event.pull_request.number }}:

            ## OWASP Top 10
            - SQL Injection vulnerabilities
            - Cross-Site Scripting (XSS)
            - Broken Authentication
            - Sensitive Data Exposure
            - XML External Entities (XXE)
            - Broken Access Control
            - Security Misconfiguration
            - Cross-Site Request Forgery (CSRF)
            - Using Components with Known Vulnerabilities
            - Insufficient Logging & Monitoring

            ## Additional Security Checks
            - Hardcoded secrets or credentials
            - Insecure cryptographic practices
            - Unsafe deserialization
            - Server-Side Request Forgery (SSRF)
            - Race conditions or TOCTOU issues

            Rate severity as: CRITICAL, HIGH, MEDIUM, LOW.
            Post detailed findings with specific recommendations.
          claude_args: |
            --model claude-opus-4-5-20251101
            --max-turns 8
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"

